name: Release to NuGet

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_QUALITY: 'preview'
  CONFIGURATION: Release

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download native binaries from latest native-build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Finding latest successful native-build run..."
          RUN_ID=$(gh run list --workflow=native-build.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "ERROR: No successful native-build run found"
            exit 1
          fi
          echo "Downloading native binaries from run $RUN_ID"
          gh run download "$RUN_ID" --name all-native-binaries --dir native-dl

          echo "Copying native binaries to runtimes directories..."
          cp native-dl/native-win-x64/pjsua2.dll \
             src/PjSip.Net.Native.Win64/runtimes/win-x64/native/
          cp native-dl/native-osx-arm64/libpjsua2.dylib \
             src/PjSip.Net.Native.MacOS/runtimes/osx-arm64/native/
          cp native-dl/native-osx-x64/libpjsua2.dylib \
             src/PjSip.Net.Native.MacOS/runtimes/osx-x64/native/
          cp native-dl/native-android-arm64/libpjsua2.so \
             src/PjSip.Net.Native.Android/runtimes/android-arm64/native/
          cp native-dl/native-ios-arm64/libpjsua2.dylib \
             src/PjSip.Net.Native.iOS/runtimes/ios-arm64/native/

          echo "Native binaries placed:"
          find src -name "*.dll" -o -name "*.dylib" -o -name "*.so" | grep runtimes

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          # Split into prefix and suffix: v1.0.0-alpha.1 -> 1.0.0 + alpha.1
          if [[ "$TAG" == *-* ]]; then
            echo "prefix=${TAG%%-*}" >> "$GITHUB_OUTPUT"
            echo "suffix=${TAG#*-}" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=$TAG" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $projects = @(
            "src/PjSip.Net/PjSip.Net.csproj",
            "tests/PjSip.Net.Tests.Unit/PjSip.Net.Tests.Unit.csproj",
            "tests/PjSip.Net.Tests.Integration/PjSip.Net.Tests.Integration.csproj"
          )
          foreach ($p in $projects) { dotnet restore $p }

      - name: Build
        shell: pwsh
        run: |
          $versionArgs = @(
            "-p:VersionPrefix=${{ steps.version.outputs.prefix }}",
            "-p:VersionSuffix=${{ steps.version.outputs.suffix }}",
            "-p:ContinuousIntegrationBuild=true"
          )
          $projects = @(
            "src/PjSip.Net/PjSip.Net.csproj",
            "tests/PjSip.Net.Tests.Unit/PjSip.Net.Tests.Unit.csproj",
            "tests/PjSip.Net.Tests.Integration/PjSip.Net.Tests.Integration.csproj"
          )
          foreach ($p in $projects) {
            dotnet build $p --no-restore -c ${{ env.CONFIGURATION }} @versionArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test
        run: |
          dotnet test tests/PjSip.Net.Tests.Unit/PjSip.Net.Tests.Unit.csproj --no-build -c ${{ env.CONFIGURATION }}
          dotnet test tests/PjSip.Net.Tests.Integration/PjSip.Net.Tests.Integration.csproj --no-build -c ${{ env.CONFIGURATION }}

      - name: Pack
        shell: pwsh
        run: |
          $projects = @(
            "src/PjSip.Net.Native.Win64/PjSip.Net.Native.Win64.csproj",
            "src/PjSip.Net.Native.MacOS/PjSip.Net.Native.MacOS.csproj",
            "src/PjSip.Net.Native.Android/PjSip.Net.Native.Android.csproj",
            "src/PjSip.Net.Native.iOS/PjSip.Net.Native.iOS.csproj",
            "src/PjSip.Net.Interop/PjSip.Net.Interop.csproj",
            "src/PjSip.Net/PjSip.Net.csproj"
          )
          foreach ($project in $projects) {
            dotnet pack $project --no-build -c ${{ env.CONFIGURATION }} -o artifacts `
              -p:VersionPrefix=${{ steps.version.outputs.prefix }} `
              -p:VersionSuffix=${{ steps.version.outputs.suffix }}
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify native packages contain binaries
        shell: pwsh
        run: |
          $checks = @{
            "PjSip.Net.Native.Win64"    = "pjsua2.dll"
            "PjSip.Net.Native.MacOS"    = "libpjsua2.dylib"
            "PjSip.Net.Native.Android"  = "libpjsua2.so"
            "PjSip.Net.Native.iOS"      = "libpjsua2.dylib"
          }
          $failed = $false
          foreach ($entry in $checks.GetEnumerator()) {
            $pkg = Get-ChildItem "artifacts/$($entry.Key).*.nupkg" | Select-Object -First 1
            if (-not $pkg) { Write-Error "Package not found: $($entry.Key)"; $failed = $true; continue }
            $zipEntries = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName).Entries.FullName
            $found = $zipEntries | Where-Object { $_ -like "*$($entry.Value)" }
            if ($found) {
              Write-Host "OK: $($pkg.Name) contains $found"
            } else {
              Write-Error "MISSING: $($pkg.Name) does not contain $($entry.Value)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*

      - name: Push to NuGet.org
        shell: pwsh
        run: |
          foreach ($pkg in Get-ChildItem artifacts/*.nupkg) {
            Write-Host "Pushing $($pkg.Name)..."
            dotnet nuget push $pkg.FullName `
              --api-key ${{ secrets.NUGET_API_KEY }} `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
