name: Build Native Binaries

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/native-build.yml'

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install SWIG
        run: choco install swig -y

      - name: Clone pjproject
        run: git clone --branch 2.16 --depth 1 https://github.com/pjsip/pjproject.git pjproject

      - name: Copy config_site.h
        run: copy native\config_site.h pjproject\pjlib\include\pj\config_site.h

      - name: Build BCG729 (static)
        shell: powershell
        run: |
          git clone --branch 1.1.1 --depth 1 https://github.com/BelledonneCommunications/bcg729.git bcg729
          New-Item -ItemType Directory -Force -Path bcg729-install\include\bcg729 | Out-Null
          New-Item -ItemType Directory -Force -Path bcg729-install\lib | Out-Null
          # Copy public headers
          Copy-Item bcg729\include\bcg729\*.h bcg729-install\include\bcg729\
          # Create static export header (no dllimport/dllexport)
          @('#ifndef BCG729_EXPORT_H','#define BCG729_EXPORT_H','#define BCG729_EXPORT','#define BCG729_NO_EXPORT','#endif') | Out-File -Encoding ascii bcg729-install\include\bcg729\bcg729_export.h
          # Compile all BCG729 C sources into a true static .lib (cmake produces a DLL import lib)
          $inc = "$env:GITHUB_WORKSPACE\bcg729-install\include"
          $lib = "$env:GITHUB_WORKSPACE\bcg729-install\lib\bcg729.lib"
          cmd /c "`"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat`" x64 && cd bcg729\src && cl /nologo /MD /O2 /DNDEBUG /DBCG729_STATIC /I..\include /I`"$inc`" /c *.c && lib /nologo /OUT:`"$lib`" *.obj"
          if ($LASTEXITCODE -ne 0) { throw "BCG729 build failed" }
          Write-Host "BCG729 static lib built:" (Get-Item $lib).Length "bytes"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build pjproject (full solution)
        shell: powershell
        env:
          CL: /I"${{ github.workspace }}\bcg729-install\include" /DBCG729_STATIC
        run: |
          # Build full solution; samples may fail to link but libraries will be produced
          & msbuild pjproject\pjproject-vs14.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal
          Write-Host "MSBuild exit code: $LASTEXITCODE (non-zero is OK - samples link errors expected)"
          # Don't fail the step — library .lib files are built before samples fail
          exit 0

      - name: Recompile BCG729 codec wrapper (fix static linking)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cl /nologo /MD /O2 /DNDEBUG /D_LIB /DBCG729_STATIC ^
             /I"pjproject\pjlib\include" ^
             /I"pjproject\pjlib-util\include" ^
             /I"pjproject\pjmedia\include" ^
             /I"pjproject\pjsip\include" ^
             /I"pjproject\pjnath\include" ^
             /I"%GITHUB_WORKSPACE%\bcg729-install\include" ^
             /c pjproject\pjmedia\src\pjmedia-codec\bcg729.c ^
             /Fo:bcg729_static.obj

      - name: List built libraries
        shell: powershell
        run: |
          Write-Host "=== Searching for .lib files ==="
          $libs = Get-ChildItem -Path pjproject -Recurse -Filter *.lib -ErrorAction SilentlyContinue
          if ($libs) { $libs | ForEach-Object { Write-Host $_.FullName } }
          else { Write-Host "WARNING: No .lib files found" }

      - name: Run SWIG
        shell: cmd
        run: |
          cd pjproject\pjsip-apps\src\swig\csharp
          swig -I"..\..\..\..\pjlib\include" ^
               -I"..\..\..\..\pjlib-util\include" ^
               -I"..\..\..\..\pjmedia\include" ^
               -I"..\..\..\..\pjsip\include" ^
               -I"..\..\..\..\pjnath\include" ^
               -w312 -c++ -csharp -dllimport pjsua2 ^
               -namespace PjSip.Net.Interop.Generated ^
               -o pjsua2_wrap.cpp ^
               "..\pjsua2.i"

      - name: Compile SWIG wrapper object
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cd pjproject\pjsip-apps\src\swig\csharp
          cl /nologo /MD /EHsc /std:c++14 /O2 /DNDEBUG /DPJ_DLL=1 /DPJ_EXPORTING=1 ^
             /I"..\..\..\..\pjlib\include" ^
             /I"..\..\..\..\pjlib-util\include" ^
             /I"..\..\..\..\pjmedia\include" ^
             /I"..\..\..\..\pjsip\include" ^
             /I"..\..\..\..\pjnath\include" ^
             /I"%GITHUB_WORKSPACE%\bcg729-install\include" ^
             /DBCG729_STATIC ^
             /c pjsua2_wrap.cpp /Fo:pjsua2_wrap.obj

      - name: Collect pjproject lib paths
        shell: powershell
        run: |
          $libs = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\pjproject" -Recurse -Filter *.lib |
                  Where-Object { $_.DirectoryName -match '\\lib$' -and $_.Name -notmatch '^libpjproject' }
          Write-Host "Found $($libs.Count) pjproject .lib files:"
          $libs | ForEach-Object { Write-Host "  $($_.FullName)" }
          $libList = ($libs | ForEach-Object { "`"$($_.FullName)`"" }) -join " "
          echo "PJLIBS=$libList" >> $env:GITHUB_ENV

      - name: Link pjsua2.dll
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cd pjproject\pjsip-apps\src\swig\csharp
          echo Linking with: %PJLIBS%
          link /nologo /DLL /OUT:pjsua2.dll pjsua2_wrap.obj ^
               "%GITHUB_WORKSPACE%\bcg729_static.obj" ^
               %PJLIBS% ^
               "%GITHUB_WORKSPACE%\bcg729-install\lib\bcg729.lib" ^
               ws2_32.lib Iphlpapi.lib dsound.lib dxguid.lib netapi32.lib ^
               mswsock.lib ole32.lib user32.lib gdi32.lib advapi32.lib ^
               Secur32.lib Crypt32.lib

      - name: Copy to runtimes
        shell: cmd
        run: |
          mkdir src\PjSip.Net.Native.Win64\runtimes\win-x64\native 2>nul
          copy pjproject\pjsip-apps\src\swig\csharp\pjsua2.dll src\PjSip.Net.Native.Win64\runtimes\win-x64\native\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-win-x64
          path: src/PjSip.Net.Native.Win64/runtimes/win-x64/native/pjsua2.dll

      - name: Upload SWIG-generated C# sources
        uses: actions/upload-artifact@v4
        with:
          name: swig-csharp-generated
          path: pjproject/pjsip-apps/src/swig/csharp/*.cs

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install swig

      - name: Clone pjproject
        run: git clone --branch 2.16 --depth 1 https://github.com/pjsip/pjproject.git pjproject

      - name: Copy config_site.h
        run: cp native/config_site.h pjproject/pjlib/include/pj/config_site.h

      - name: Build BCG729
        run: |
          git clone --branch 1.1.1 --depth 1 https://github.com/BelledonneCommunications/bcg729.git bcg729
          cmake -S bcg729 -B bcg729-build \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/bcg729-install" \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DBUILD_SHARED_LIBS=OFF \
              -DENABLE_TESTS=OFF
          cmake --build bcg729-build --config Release
          cmake --install bcg729-build --config Release

      - name: Configure pjproject
        run: |
          cd pjproject
          ./configure --with-bcg729="$GITHUB_WORKSPACE/bcg729-install"
          make dep

      - name: Build pjproject libraries
        run: |
          cd pjproject
          CPUS=$(sysctl -n hw.logicalcpu)
          # Build each library module individually to continue past test binary link failures
          for dir in pjlib pjlib-util pjnath third_party pjmedia pjsip; do
            echo "=== Building $dir ==="
            make -C "$dir/build" -j$CPUS || echo "WARNING: $dir build had errors (test binary link failures are OK)"
          done
          echo "=== Built libraries ==="
          find . -name "*.a" -path "*/lib/*"
          test -n "$(find . -name '*.a' -path '*/lib/*' -print -quit)" || { echo "ERROR: No .a libraries found"; exit 1; }

      - name: Run SWIG
        run: |
          cd pjproject/pjsip-apps/src/swig/csharp
          swig -I"$GITHUB_WORKSPACE/pjproject/pjlib/include" \
               -I"$GITHUB_WORKSPACE/pjproject/pjlib-util/include" \
               -I"$GITHUB_WORKSPACE/pjproject/pjmedia/include" \
               -I"$GITHUB_WORKSPACE/pjproject/pjsip/include" \
               -I"$GITHUB_WORKSPACE/pjproject/pjnath/include" \
               -w312 -c++ -csharp \
               -dllimport pjsua2 \
               -namespace PjSip.Net.Interop.Generated \
               -o pjsua2_wrap.cpp \
               ../pjsua2.i

      - name: Compile SWIG wrapper
        run: |
          cd pjproject/pjsip-apps/src/swig/csharp
          g++ -c -std=c++14 -arch arm64 -O2 \
              -I"$GITHUB_WORKSPACE/pjproject/pjlib/include" \
              -I"$GITHUB_WORKSPACE/pjproject/pjlib-util/include" \
              -I"$GITHUB_WORKSPACE/pjproject/pjmedia/include" \
              -I"$GITHUB_WORKSPACE/pjproject/pjsip/include" \
              -I"$GITHUB_WORKSPACE/pjproject/pjnath/include" \
              -DPJ_AUTOCONF=1 \
              pjsua2_wrap.cpp -o pjsua2_wrap.o

      - name: Link libpjsua2.dylib
        run: |
          cd pjproject/pjsip-apps/src/swig/csharp
          pj_libs=$(find "$GITHUB_WORKSPACE/pjproject" -name "*.a" -path "*/lib/*" | tr '\n' ' ')
          echo "Linking with: $pj_libs"
          g++ -shared -arch arm64 -o libpjsua2.dylib \
              pjsua2_wrap.o \
              $pj_libs \
              -L"$GITHUB_WORKSPACE/bcg729-install/lib" -lbcg729 \
              -framework CoreAudio -framework AudioToolbox -framework AVFoundation \
              -framework CoreMedia -framework Security -framework SystemConfiguration \
              -framework Foundation -framework Network \
              -lpthread

      - name: Copy to runtimes
        run: |
          OUTPUT_DIR="src/PjSip.Net.Native.MacOS/runtimes/osx-arm64/native"
          mkdir -p "$OUTPUT_DIR"
          cp pjproject/pjsip-apps/src/swig/csharp/libpjsua2.dylib "$OUTPUT_DIR/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-osx-arm64
          path: src/PjSip.Net.Native.MacOS/runtimes/osx-arm64/native/libpjsua2.dylib

  build-macos-x64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install swig

      - name: Clone pjproject
        run: git clone --branch 2.16 --depth 1 https://github.com/pjsip/pjproject.git pjproject

      - name: Copy config_site.h
        run: cp native/config_site.h pjproject/pjlib/include/pj/config_site.h

      - name: Build BCG729
        run: |
          git clone --branch 1.1.1 --depth 1 https://github.com/BelledonneCommunications/bcg729.git bcg729
          cmake -S bcg729 -B bcg729-build \
              -DCMAKE_OSX_ARCHITECTURES=x86_64 \
              -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/bcg729-install" \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DBUILD_SHARED_LIBS=OFF \
              -DENABLE_TESTS=OFF
          cmake --build bcg729-build --config Release
          cmake --install bcg729-build --config Release

      - name: Configure pjproject for x86_64
        run: |
          cd pjproject
          export CFLAGS="-arch x86_64"
          export CXXFLAGS="-arch x86_64"
          export LDFLAGS="-arch x86_64"
          ./configure --host=x86_64-apple-darwin --with-bcg729="$GITHUB_WORKSPACE/bcg729-install"
          make dep

      - name: Build pjproject libraries
        run: |
          cd pjproject
          CPUS=$(sysctl -n hw.logicalcpu)
          for dir in pjlib pjlib-util pjnath third_party pjmedia pjsip; do
            echo "=== Building $dir ==="
            make -C "$dir/build" -j$CPUS || echo "WARNING: $dir build had errors"
          done
          echo "=== Built libraries ==="
          find . -name "*.a" -path "*/lib/*"
          test -n "$(find . -name '*.a' -path '*/lib/*' -print -quit)" || { echo "ERROR: No .a libraries found"; exit 1; }

      - name: Run SWIG
        run: |
          cd pjproject/pjsip-apps/src/swig/csharp
          swig -I"$GITHUB_WORKSPACE/pjproject/pjlib/include" \
               -I"$GITHUB_WORKSPACE/pjproject/pjlib-util/include" \
               -I"$GITHUB_WORKSPACE/pjproject/pjmedia/include" \
               -I"$GITHUB_WORKSPACE/pjproject/pjsip/include" \
               -I"$GITHUB_WORKSPACE/pjproject/pjnath/include" \
               -w312 -c++ -csharp \
               -dllimport pjsua2 \
               -namespace PjSip.Net.Interop.Generated \
               -o pjsua2_wrap.cpp \
               ../pjsua2.i

      - name: Compile SWIG wrapper
        run: |
          cd pjproject/pjsip-apps/src/swig/csharp
          clang++ -c -std=c++14 -arch x86_64 -O2 \
              -I"$GITHUB_WORKSPACE/pjproject/pjlib/include" \
              -I"$GITHUB_WORKSPACE/pjproject/pjlib-util/include" \
              -I"$GITHUB_WORKSPACE/pjproject/pjmedia/include" \
              -I"$GITHUB_WORKSPACE/pjproject/pjsip/include" \
              -I"$GITHUB_WORKSPACE/pjproject/pjnath/include" \
              -DPJ_AUTOCONF=1 \
              pjsua2_wrap.cpp -o pjsua2_wrap.o

      - name: Link libpjsua2.dylib
        run: |
          cd pjproject/pjsip-apps/src/swig/csharp
          pj_libs=$(find "$GITHUB_WORKSPACE/pjproject" -name "*.a" -path "*/lib/*" | tr '\n' ' ')
          echo "Linking with: $pj_libs"
          clang++ -shared -arch x86_64 -o libpjsua2.dylib \
              pjsua2_wrap.o \
              $pj_libs \
              -L"$GITHUB_WORKSPACE/bcg729-install/lib" -lbcg729 \
              -framework CoreAudio -framework AudioToolbox -framework AVFoundation \
              -framework CoreMedia -framework Security -framework SystemConfiguration \
              -framework Foundation -framework Network \
              -lpthread

      - name: Copy to runtimes
        run: |
          OUTPUT_DIR="src/PjSip.Net.Native.MacOS/runtimes/osx-x64/native"
          mkdir -p "$OUTPUT_DIR"
          cp pjproject/pjsip-apps/src/swig/csharp/libpjsua2.dylib "$OUTPUT_DIR/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-osx-x64
          path: src/PjSip.Net.Native.MacOS/runtimes/osx-x64/native/libpjsua2.dylib

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y swig

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Clone pjproject
        run: git clone --branch 2.16 --depth 1 https://github.com/pjsip/pjproject.git pjproject

      - name: Copy config_site.h
        run: cp native/config_site.h pjproject/pjlib/include/pj/config_site.h

      - name: Build OpenSSL for Android arm64
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          OPENSSL_VERSION="3.4.1"
          curl -sL "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" -o openssl.tar.gz
          tar xzf openssl.tar.gz
          cd "openssl-${OPENSSL_VERSION}"
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          ./Configure android-arm64 -D__ANDROID_API__=28 \
              --prefix="$GITHUB_WORKSPACE/openssl-install" \
              no-shared no-tests
          make -j$(nproc)
          make install_sw
          echo "OpenSSL installed to $GITHUB_WORKSPACE/openssl-install"
          ls -la "$GITHUB_WORKSPACE/openssl-install/lib/"

      - name: Build BCG729
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          git clone --branch 1.1.1 --depth 1 https://github.com/BelledonneCommunications/bcg729.git bcg729
          cmake -S bcg729 -B bcg729-build \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-28 \
              -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/bcg729-install" \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DBUILD_SHARED_LIBS=OFF \
              -DENABLE_TESTS=OFF
          cmake --build bcg729-build --config Release
          cmake --install bcg729-build --config Release

      - name: Configure pjproject
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          TARGET_ABI: arm64-v8a
        run: |
          cd pjproject
          ./configure-android --use-ndk-cflags \
              --with-ssl="$GITHUB_WORKSPACE/openssl-install" \
              --with-bcg729="$GITHUB_WORKSPACE/bcg729-install"
          make dep

      - name: Build pjproject libraries
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          TARGET_ABI: arm64-v8a
        run: |
          cd pjproject
          CPUS=$(nproc)
          for dir in pjlib pjlib-util pjnath third_party pjmedia pjsip; do
            echo "=== Building $dir ==="
            make -C "$dir/build" -j$CPUS || echo "WARNING: $dir build had errors"
          done
          echo "=== Built libraries ==="
          find . -name "*.a" -path "*/lib/*"
          test -n "$(find . -name '*.a' -path '*/lib/*' -print -quit)" || { echo "ERROR: No .a libraries found"; exit 1; }

      - name: Run SWIG
        run: |
          cd pjproject/pjsip-apps/src/swig/csharp
          swig -I"$GITHUB_WORKSPACE/pjproject/pjlib/include" \
               -I"$GITHUB_WORKSPACE/pjproject/pjlib-util/include" \
               -I"$GITHUB_WORKSPACE/pjproject/pjmedia/include" \
               -I"$GITHUB_WORKSPACE/pjproject/pjsip/include" \
               -I"$GITHUB_WORKSPACE/pjproject/pjnath/include" \
               -w312 -c++ -csharp \
               -dllimport pjsua2 \
               -namespace PjSip.Net.Interop.Generated \
               -o pjsua2_wrap.cpp \
               ../pjsua2.i

      - name: Compile SWIG wrapper
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd pjproject/pjsip-apps/src/swig/csharp
          TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          $TOOLCHAIN/bin/aarch64-linux-android28-clang++ \
              -c -O2 -fPIC \
              -I"$GITHUB_WORKSPACE/pjproject/pjlib/include" \
              -I"$GITHUB_WORKSPACE/pjproject/pjlib-util/include" \
              -I"$GITHUB_WORKSPACE/pjproject/pjmedia/include" \
              -I"$GITHUB_WORKSPACE/pjproject/pjsip/include" \
              -I"$GITHUB_WORKSPACE/pjproject/pjnath/include" \
              -DPJ_AUTOCONF=1 -DPJ_IS_BIG_ENDIAN=0 -DPJ_IS_LITTLE_ENDIAN=1 \
              pjsua2_wrap.cpp -o pjsua2_wrap.o

      - name: Link libpjsua2.so
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd pjproject/pjsip-apps/src/swig/csharp
          TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          CC="$TOOLCHAIN/bin/aarch64-linux-android28-clang++"
          pj_libs=$(find "$GITHUB_WORKSPACE/pjproject" -name "*.a" -path "*/lib/*" | tr '\n' ' ')
          echo "Linking with: $pj_libs"
          $CC -shared -o libpjsua2.so \
              pjsua2_wrap.o \
              $pj_libs \
              -L"$GITHUB_WORKSPACE/bcg729-install/lib" -lbcg729 \
              -L"$GITHUB_WORKSPACE/openssl-install/lib" -lssl -lcrypto \
              -lOpenSLES -llog -landroid \
              -latomic -lm

      - name: Copy to runtimes
        run: |
          OUTPUT_DIR="src/PjSip.Net.Native.Android/runtimes/android-arm64/native"
          mkdir -p "$OUTPUT_DIR"
          cp pjproject/pjsip-apps/src/swig/csharp/libpjsua2.so "$OUTPUT_DIR/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-android-arm64
          path: src/PjSip.Net.Native.Android/runtimes/android-arm64/native/libpjsua2.so

  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install SWIG
        run: brew install swig

      - name: Clone pjproject
        run: git clone --branch 2.16 --depth 1 https://github.com/pjsip/pjproject.git pjproject

      - name: Copy config_site.h
        run: cp native/config_site.h pjproject/pjlib/include/pj/config_site.h

      - name: Build BCG729
        run: |
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          git clone --branch 1.1.1 --depth 1 https://github.com/BelledonneCommunications/bcg729.git bcg729
          cmake -S bcg729 -B bcg729-build \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
              -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/bcg729-install" \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DBUILD_SHARED_LIBS=OFF \
              -DENABLE_TESTS=OFF
          cmake --build bcg729-build --config Release
          cmake --install bcg729-build --config Release

      - name: Configure pjproject for iOS
        run: |
          cd pjproject
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CFLAGS="-arch arm64 -isysroot $IOS_SDK -miphoneos-version-min=16.0 -I$GITHUB_WORKSPACE/bcg729-install/include"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-arch arm64 -isysroot $IOS_SDK -miphoneos-version-min=16.0 -L$GITHUB_WORKSPACE/bcg729-install/lib"
          ./configure --host=aarch64-apple-darwin \
              --disable-sdl --disable-ffmpeg --disable-v4l2 \
              --disable-openh264 --disable-vpx --disable-libyuv \
              --with-bcg729="$GITHUB_WORKSPACE/bcg729-install"
          make dep

      - name: Build pjproject libraries for iOS
        run: |
          cd pjproject
          CPUS=$(sysctl -n hw.logicalcpu)
          for dir in pjlib pjlib-util pjnath third_party pjmedia pjsip; do
            echo "=== Building $dir ==="
            make -C "$dir/build" -j$CPUS || echo "WARNING: $dir build had errors"
          done
          echo "=== Built libraries ==="
          find . -name "*.a" -path "*/lib/*"
          test -n "$(find . -name '*.a' -path '*/lib/*' -print -quit)" || { echo "ERROR: No .a libraries found"; exit 1; }

      - name: Compile BCG729 codec into pjmedia-codec
        run: |
          cd pjproject
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "=== Compiling bcg729.c for iOS ==="
          xcrun -sdk iphoneos clang \
              -arch arm64 -isysroot "$IOS_SDK" -miphoneos-version-min=16.0 \
              -I"pjlib/include" -I"pjlib-util/include" -I"pjmedia/include" \
              -I"pjsip/include" -I"pjnath/include" \
              -I"$GITHUB_WORKSPACE/bcg729-install/include" \
              -DPJ_AUTOCONF=1 -DBCG729_STATIC \
              -O2 -c pjmedia/src/pjmedia-codec/bcg729.c -o bcg729.o
          CODEC_LIB=$(find . -name "libpjmedia-codec-*.a" -path "*/lib/*" | head -1)
          echo "Adding bcg729.o to $CODEC_LIB"
          ar rs "$CODEC_LIB" bcg729.o

      - name: Compile iOS Objective-C sources
        run: |
          cd pjproject
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "=== Compiling iOS-specific Objective-C sources ==="
          find . -name "*.m" -path "*/src/*" ! -path "*/pjsip-apps/*" | while read mfile; do
            ofile="${mfile%.m}.o"
            echo "Compiling $mfile -> $ofile"
            xcrun -sdk iphoneos clang \
                -arch arm64 -isysroot "$IOS_SDK" -miphoneos-version-min=16.0 \
                -I"pjlib/include" -I"pjlib-util/include" -I"pjmedia/include" \
                -I"pjsip/include" -I"pjnath/include" \
                -DPJ_AUTOCONF=1 \
                -c "$mfile" -o "$ofile" || echo "WARNING: Failed to compile $mfile"
          done

      - name: Run SWIG
        run: |
          cd pjproject/pjsip-apps/src/swig/csharp
          swig -I"$GITHUB_WORKSPACE/pjproject/pjlib/include" \
               -I"$GITHUB_WORKSPACE/pjproject/pjlib-util/include" \
               -I"$GITHUB_WORKSPACE/pjproject/pjmedia/include" \
               -I"$GITHUB_WORKSPACE/pjproject/pjsip/include" \
               -I"$GITHUB_WORKSPACE/pjproject/pjnath/include" \
               -w312 -c++ -csharp \
               -dllimport pjsua2 \
               -namespace PjSip.Net.Interop.Generated \
               -o pjsua2_wrap.cpp \
               ../pjsua2.i

      - name: Compile wrapper and link
        run: |
          cd pjproject/pjsip-apps/src/swig/csharp
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun -sdk iphoneos clang++ \
              -std=c++14 \
              -arch arm64 -isysroot "$IOS_SDK" -miphoneos-version-min=16.0 \
              -I"$GITHUB_WORKSPACE/pjproject/pjlib/include" \
              -I"$GITHUB_WORKSPACE/pjproject/pjlib-util/include" \
              -I"$GITHUB_WORKSPACE/pjproject/pjmedia/include" \
              -I"$GITHUB_WORKSPACE/pjproject/pjsip/include" \
              -I"$GITHUB_WORKSPACE/pjproject/pjnath/include" \
              -DPJ_AUTOCONF=1 \
              -c pjsua2_wrap.cpp -o pjsua2_wrap.o

          pj_libs=$(find "$GITHUB_WORKSPACE/pjproject" -name "*.a" -path "*/lib/*" | tr '\n' ' ')
          objc_objs=$(find "$GITHUB_WORKSPACE/pjproject" -name "*.o" -path "*/src/*.o" ! -name "pjsua2_wrap.o" ! -path "*/pjsip-apps/*" 2>/dev/null | tr '\n' ' ')
          echo "Linking with libs: $pj_libs"
          echo "Linking with ObjC objects: $objc_objs"
          xcrun -sdk iphoneos clang++ \
              -arch arm64 -isysroot "$IOS_SDK" -miphoneos-version-min=16.0 \
              -dynamiclib -install_name @rpath/libpjsua2.dylib \
              -o libpjsua2.dylib \
              pjsua2_wrap.o \
              $objc_objs \
              $pj_libs \
              -L"$GITHUB_WORKSPACE/bcg729-install/lib" -lbcg729 \
              -framework CoreAudio -framework AudioToolbox -framework AVFoundation \
              -framework CoreMedia -framework Security -framework SystemConfiguration \
              -framework Foundation -framework Network -framework UIKit \
              -lpthread

      - name: Copy to runtimes
        run: |
          OUTPUT_DIR="src/PjSip.Net.Native.iOS/runtimes/ios-arm64/native"
          mkdir -p "$OUTPUT_DIR"
          cp pjproject/pjsip-apps/src/swig/csharp/libpjsua2.dylib "$OUTPUT_DIR/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-arm64
          path: src/PjSip.Net.Native.iOS/runtimes/ios-arm64/native/libpjsua2.dylib

  collect:
    needs: [build-windows, build-macos-arm64, build-macos-x64, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: natives
          pattern: native-*

      - name: Download SWIG C# sources
        uses: actions/download-artifact@v4
        with:
          name: swig-csharp-generated
          path: swig-csharp

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-native-binaries
          path: natives/

      - name: Upload SWIG C# artifact
        uses: actions/upload-artifact@v4
        with:
          name: swig-csharp-sources
          path: swig-csharp/
